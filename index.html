      .nav-link::after{left:0;bottom:0;transform:none}.nav-link:hover::after,.nav-link.active::after{width:100%}
      .nav-group{width:100%}.nav-group-head .nav-link{width:100%}.nav-toggle{width:32px}
      .sub-pages{position:static;min-width:0;padding:2px 0 2px 14px;margin-top:2px;background:transparent;border:0;border-left:1px solid rgba(216,189,134,.22);box-shadow:none;transition:max-height .22s ease,margin .22s ease}.nav-group.collapsed .sub-pages{padding:0 0 0 14px;margin-top:0;border-left-color:transparent}
      .sub-pages .sub{width:100%;padding:8px 10px;font-size:.65rem;color:var(--muted);white-space:normal;overflow-wrap:break-word;word-break:break-word}.sub-pages .sub:hover{background:transparent;color:var(--gold)}
      main{height:100%;min-height:0}.content{padding-bottom:58px}.menu{display:none}
    }

    /* Full-page canvas: remove the presentation-card feeling around the site. */
    @media(min-width:761px){
      .app{width:100%;height:100dvh;min-height:0;margin:0;border:0;border-radius:0;outline:0;box-shadow:none}
      .app::after{display:none}
      aside{background:linear-gradient(180deg,rgba(9,12,13,.99),rgba(4,6,7,.99))}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar"><div class="brand"><a href="#home" class="brand-logo" aria-label="กลับหน้าหลัก"><img src="image/logo.png" alt="Medieval RP"></a><small>ROLEPLAY THAILAND</small></div><nav id="navigation"></nav></aside>
    <main><div class="content" id="content"></div><div class="sponsor-bar" id="sponsorBar" aria-label="ผู้สนับสนุน"><div class="sponsor-inner"><div class="sponsor-heading">Partner</div><div class="sponsor-list" id="sponsorList"></div></div></div><button class="menu" id="menu" aria-label="เปิดเมนู">☰</button></main>
  </div>
  <script>
    /*
 * ================================
 * MENU / PAGE SETTINGS
 * ================================
 * enabled: true  = แสดงเมนูและเปิดหน้าได้ (ถ้า id ถูกใส่ใน menuStructure ด้านล่างด้วย)
 * enabled: false = ซ่อนเมนูและไม่อนุญาตให้เปิดหน้านั้น
 *
 * หมายเหตุ: หน้าที่ enabled:true แต่ "ไม่ได้" ใส่ไว้ใน menuStructure
 * จะไม่มีปุ่มโชว์ในเมนูซ้ายมือ แต่ยังเปิดได้ปกติผ่านลิงก์ #id ตรง ๆ
 * (ใช้กับหน้าอย่าง PARTNER ที่อยากให้เปิดเฉพาะตอนกดรูป sponsor)
 *
 * ในอนาคตเพิ่ม EP ใหม่ได้โดยเพิ่มรายการ เช่น:
 * {id:'ep4', label:'เนื้อเรื่อง EP.4', file:'EP4.html', enabled:false}
 */
const pages=[
  {id:'home',label:'HOME',file:'home.html',enabled:true},
  {id:'about',label:'ABOUT',file:'about.html',enabled:true},
  {id:'rules',label:'RULES',file:'rules.html',enabled:true},
  {id:'lore',label:'SERVER LORE',file:'server-lore.html',enabled:true},

  {id:'ep1',label:'เนื้อเรื่อง EP.1',file:'ep1.html',enabled:true},
  {id:'ep2',label:'เนื้อเรื่อง EP.2',file:'ep2.html',enabled:false},
  {id:'ep3',label:'เนื้อเรื่อง EP.3',file:'ep3.html',enabled:false},
  {id:'ep4',label:'เนื้อเรื่อง EP.4',file:'ep4.html',enabled:false},

  {id:'guide',label:'GUIDE',file:'guide.html',enabled:true},
  {id:'legend',label:'เรื่องเล่า ตำนาน',file:'legend.html',enabled:true},
  {id:'roles',label:'บทบาท',file:'roles.html',enabled:true},

  {id:'whitelist',label:'Whitelist Registration',file:'whitelist-registration.html',enabled:true},
  
  {id:'support',label:'POINTS SHOP',file:'support.html',enabled:true},
  {id:'supporter',label:'SUPPORTER',file:'supporter.html',enabled:true},
  {id:'gifting',label:'GIFTING',file:'gifting.html',enabled:true},
  {id:'early-supporter',label:'EARLY SUPPORTER',file:'early-supporter.html',enabled:true},
  {id:'prio-whitelist',label:'PRIO WHITELIST',file:'prio-whitelist.html',enabled:true},
	

  // หน้านี้เปิดได้ผ่านลิงก์ #partner เท่านั้น (เช่น จากรูป sponsor)
  // enabled:true = อนุญาตให้เปิดหน้าได้ แต่ไม่ถูกใส่ใน menuStructure ด้านล่าง
  // จึงไม่มีปุ่มขึ้นในเมนูซ้ายมือ
  {id:'partner',label:'PARTNER',file:'PARTNER.html',enabled:true}
];

const nav=document.getElementById('navigation');
const content=document.getElementById('content');

// ค้นหาหน้าจาก ID
const getPage=(id)=>pages.find(p=>p.id===id);

// สร้างปุ่มเมนูเฉพาะหน้าที่ enabled
const makeLink=(page)=>{
  if(!page || !page.enabled) return null;
  const b=document.createElement('button');
  b.className='nav-link';
  b.dataset.id=page.id;
  b.textContent=page.label;
  b.onclick=()=>location.hash=page.id;
  return b;
};

// กำหนดโครงสร้างเมนู
// หมายเหตุ: 'partner' ตั้งใจไม่ใส่ไว้ในนี้ เพื่อไม่ให้ขึ้นปุ่มในเมนูซ้ายมือ
const menuStructure=[
  {id:'home'},
  {id:'about'},
  {id:'rules'},
  {id:'lore',children:['legend','roles','ep1','ep2','ep3','ep4']},
  {id:'guide',children:['roles']},
  {id:'whitelist'},
  {id:'support',children:['early-supporter','prio-whitelist','supporter','gifting']},
];

// สร้างเมนูจากการตั้งค่า enabled
menuStructure.forEach(item=>{
  const parent=getPage(item.id);
  if(!parent || !parent.enabled) return;

  if(!item.children){
    const link=makeLink(parent);
    if(link) nav.append(link);
    return;
  }

  const enabledChildren=item.children
    .map(getPage)
    .filter(page=>page && page.enabled);

  // ถ้าไม่มีหน้าย่อยที่เปิดอยู่ จะไม่สร้างกลุ่ม
  if(enabledChildren.length===0) return;

  const group=document.createElement('div');
  group.className='nav-group collapsed';

  const head=document.createElement('div');
  head.className='nav-group-head';

  const parentLink=makeLink(parent);
  if(parentLink) head.append(parentLink);

  const toggle=document.createElement('button');
  toggle.className='nav-toggle';
  toggle.innerHTML='<svg class="nav-toggle-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12.7071 14.7071C12.3166 15.0976 11.6834 15.0976 11.2929 14.7071L6.29289 9.70711C5.90237 9.31658 5.90237 8.68342 6.29289 8.29289C6.68342 7.90237 7.31658 7.90237 7.70711 8.29289L12 12.5858L16.2929 8.29289C16.6834 7.90237 17.3166 7.90237 17.7071 8.29289C18.0976 8.68342 18.0976 9.31658 17.7071 9.70711L12.7071 14.7071Z" fill="currentColor"/></svg>';
  toggle.setAttribute('aria-label','เปิด/ปิดหน้าย่อย');
  toggle.onclick=(e)=>{
    e.preventDefault();
    e.stopPropagation();
    group.classList.toggle('collapsed');
  };
  head.append(toggle);

  const sub=document.createElement('div');
  sub.className='sub-pages';

  enabledChildren.forEach(page=>{
    const link=makeLink(page);
    if(link){
      link.classList.add('sub');
      sub.append(link);
    }
  });

  group.append(head,sub);
  nav.append(group);
});

// ================================
// SUPPORTER / SPONSOR BAR
// ================================
// เพิ่มผู้สนับสนุนได้จากรายการนี้
// image = ชื่อไฟล์รูป หรือ URL ของรูป
// url   = ปลายทางเมื่อคลิกรูป
//         - ใส่ '#partner' เพื่อเด้งไปหน้า PARTNER ภายในเว็บนี้เอง (เปิดในแท็บเดิม)
//         - ใส่ URL ภายนอกเต็มรูปแบบ (เช่น https://facebook.com/...) เพื่อเปิดเว็บอื่นในแท็บใหม่
const sponsors = [
  {image:'image/sponsor/sponsor1.png', url:'https://www.facebook.com/kaigroomingofficial'},
  //{image:'image/sponsor/sponsor2.png', url:'#partner'},
  //{image:'image/sponsor/sponsor3.png', url:'#partner'},
  //{image:'image/sponsor/sponsor4.png', url:'#partner'},
  //{image:'image/sponsor/sponsor5.png', url:'#partner'},
  //{image:'image/sponsor/sponsor6.png', url:'#partner'}
];

const sponsorList=document.getElementById('sponsorList');
function renderSponsors(){
  if(!sponsorList) return;
  sponsorList.replaceChildren();

  if(!sponsors.length){
    const empty=document.createElement('div');
    empty.className='sponsor-empty';
    sponsorList.append(empty);
    return;
  }

  sponsors.forEach((sponsor)=>{
    if(!sponsor.image) return;

    const card=document.createElement('a');
    card.className='sponsor-card';
    card.href=sponsor.url || '#';

    // ลิงก์ภายในเว็บ (ขึ้นต้นด้วย #) ให้เปิดในแท็บเดิม
    // ลิงก์ภายนอกยังเปิดแท็บใหม่ตามเดิม
    const isInternal=(sponsor.url||'').startsWith('#');
    if(!isInternal){
      card.target='_blank';
      card.rel='noopener noreferrer';
    }

    card.setAttribute('aria-label','เปิดเว็บไซต์ผู้สนับสนุน');

    const img=document.createElement('img');
    img.src=sponsor.image;
    img.alt='Sponsor';
    img.loading='lazy';
    img.onerror=()=>card.remove();
    card.append(img);
    sponsorList.append(card);
  });
}
renderSponsors();

// โหลดทุกหน้าจากไฟล์ HTML ต้นทางของหน้านั้นเอง
function loadPage(item){
  const frame=document.createElement('iframe');
  frame.className='page-frame';
  frame.title=item.label;
  frame.src=item.file;
  frame.loading='eager';
  frame.setAttribute('scrolling','auto');

  frame.addEventListener('load',()=>{
    // Apply one shared black-and-gold visual language to each original page.
    try{
      const doc=frame.contentDocument;
      if(doc && !doc.getElementById('shared-got-theme')){
        const theme=document.createElement('link');
        theme.id='shared-got-theme';
        theme.rel='stylesheet';
        theme.href=new URL('theme.css',window.location.href).href;
        doc.head.append(theme);
      }
    }catch(e){}
    // คงพฤติกรรมการย่อหน้าภายใน iframe แบบเดิม
    try{
      frame.contentDocument.documentElement.style.zoom='1';
    }catch(e){
      // ถ้า iframe ถูกบล็อกการเข้าถึง DOM ให้แสดงตามขนาดปกติ
    }
  });

  content.replaceChildren(frame);
}

function render(){
  const requestedId=location.hash.slice(1)||'home';
  let item=getPage(requestedId);

  // ถ้าหน้านั้นถูกปิด หรือไม่มีอยู่จริง ให้กลับ HOME
  if(!item || !item.enabled){
    item=getPage('home');
    if(location.hash !== '#home') history.replaceState(null,'','#home');
  }

  document.querySelectorAll('.nav-link').forEach(x=>{
    x.classList.toggle('active',x.dataset.id===item.id);
  });

  document.body.classList.remove('menu-open');

  document.querySelectorAll('.nav-group').forEach(g=>{
    const activeLink=g.querySelector(`[data-id="${item.id}"]`);
    const headLink=g.querySelector('.nav-group-head .nav-link');

    if(activeLink && headLink && item.id!==headLink.dataset.id){
      g.classList.remove('collapsed');
    }
  });

  // ไม่มีข้อมูลเนื้อหาซ้ำใน index.html อีกต่อไป
  // ทุกหน้าจะถูกโหลดจากไฟล์ .html ต้นทางของตัวเอง
  loadPage(item);
}

window.addEventListener('hashchange',render);
document.getElementById('menu').onclick=()=>document.body.classList.toggle('menu-open');
render();
</script>
</body>
</html>
